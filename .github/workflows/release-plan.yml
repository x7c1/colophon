name: Release Plan

# Decides whether the commit CI just judged on the default branch is the merge
# of a release PR. Call it from a workflow triggered by `workflow_run` of the
# CI workflow; build any release assets in a job that needs this one, then
# call release-publish.yml. See docs/usage.md.

on:
  workflow_call:
    inputs:
      version-scheme:
        description: "semver (vX.Y.Z) or integer (vN)"
        type: string
        required: true
    outputs:
      released:
        description: "'true' when the commit is a release"
        value: ${{ jobs.plan.outputs.released }}
      version:
        description: "The version, e.g. 8.0.0"
        value: ${{ jobs.plan.outputs.version }}
      tag:
        description: "The tag to cut, e.g. v8.0.0"
        value: ${{ jobs.plan.outputs.tag }}
      sha:
        description: "The commit to tag"
        value: ${{ jobs.plan.outputs.sha }}
      pr-number:
        description: "The merged release PR"
        value: ${{ jobs.plan.outputs.pr-number }}

jobs:
  plan:
    # Only a green CI run started by a push to this repository's default
    # branch. The `branches` filter of workflow_run matches by name, so a
    # pull request from a fork's own main would pass it too.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha }}
      pr-number: ${{ steps.plan.outputs.pr-number }}
    steps:
      - name: Check out colophon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: colophon
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COLOPHON_SCHEME: ${{ inputs.version-scheme }}
          # The commit CI ran on, not the newest commit on the branch.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: colophon/scripts/plan-release.sh
