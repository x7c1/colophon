name: Self Release PR

# colophon releases itself with its own workflows.

on:
  push:
    branches:
      - main
  pull_request:
    types: [edited]
  workflow_dispatch:

jobs:
  release-pr:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-pr.yml
    with:
      version-scheme: semver
