name: Self Release PR

# colophon releases itself with its own workflows.

on:
  push:
    branches:
      - main
  pull_request:
    types: [edited]
  workflow_dispatch:

jobs:
  release-pr:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-pr.yml
    with:
      version-scheme: semver
      # Empty until the App is registered, which falls back to GITHUB_TOKEN.
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
