name: Validate Release PR

# Holds a release PR to its title and summary rules. Call it from a workflow
# triggered by `pull_request` (opened, edited, synchronize, reopened) and make
# its job a required check. PRs that are not release PRs pass. See
# docs/usage.md.

on:
  workflow_call:
    inputs:
      version-scheme:
        description: "semver (vX.Y.Z) or integer (vN)"
        type: string
        required: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Skip when not a release PR
        id: gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == "Release v"* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release PR; nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Check out colophon
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: colophon
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Validate the title and summary
        if: steps.gate.outputs.skip == 'false'
        working-directory: repo
        env:
          SCHEME: ${{ inputs.version-scheme }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          source ../colophon/scripts/lib/github.sh
          ../colophon/scripts/validate-release-pr.sh "$SCHEME" "$PR_TITLE" "$PR_BODY" "$(last_version_tag HEAD)"
