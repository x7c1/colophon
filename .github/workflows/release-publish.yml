name: Release Publish

# Tags the planned commit, publishes the GitHub Release with the summary from
# the release PR, and attaches the files of an optional artifact. Call it with
# the outputs of release-plan.yml. See docs/usage.md.

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to cut (release-plan's tag)"
        type: string
        required: true
      sha:
        description: "The commit to tag (release-plan's sha)"
        type: string
        required: true
      pr-number:
        description: "The merged release PR (release-plan's pr-number)"
        type: string
        required: true
      artifact-name:
        description: "An artifact uploaded earlier in the run whose files become release assets"
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out colophon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: colophon
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Download the release assets
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: assets

      - name: Publish the release
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          shopt -s nullglob
          ../colophon/scripts/publish-release.sh ../assets/*
